[package]
name = "omnitransfer-desktop"
version = "0.1.0"
edition = "2021"
description = "OmniTransfer Tauri desktop application"

[lib]
name = "omnitransfer_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "1", features = ["shell-open", "system-tray", "updater", "window-close", "window-minimize", "window-maximize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
omnicore = { path = "../../core" }
log = "0.4"
env_logger = "0.11"
thiserror = "1"
once_cell = "1"

# Platform-specific: Windows Wi-Fi / BLE via WinRT
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.57", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_WiFi",
    "Networking_Connectivity",
] }

# Platform-specific: macOS Wi-Fi / BLE via CoreBluetooth
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
objc = "0.2"

# Platform-specific: Linux via D-Bus / BlueZ
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", features = ["tokio"] }

[build-dependencies]
tauri-build = { version = "1", features = [] }
