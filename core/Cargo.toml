[package]
name = "omnicore"
version = "0.1.0"
edition = "2021"
description = "OmniTransfer core library — custom reliable UDP, Noise KK handshake, BLAKE3 hashing, Reed-Solomon FEC"
license = "MIT"

[lib]
name = "omnicore"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
rand = "0.8"
blake3 = "1"
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
noise-protocol = "0.2"
noise-rust-crypto = "0.6"
reed-solomon-erasure = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
log = "0.4"
thiserror = "1"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
env_logger = "0.11"
